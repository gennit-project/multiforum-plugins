name: Publish Registry

# Regenerates the registry files from registry-sources.json (reading each
# standalone plugin repo's GitHub Releases) and uploads them to the GCS objects
# that production reads:
#   gs://mf-plugins-prod/registry.json              (default registry)
#   gs://mf-plugins-prod/registry-experimental.json (experimental registry)
#
# A server opts into a registry by adding its URL to the server config's
# pluginRegistries list; the split here is only about which plugins are
# published to which URL.
#
# Triggers:
#   - workflow_dispatch: publish on demand (e.g. right after a plugin cuts a
#     new release in its own repo).
#   - push to main touching the sources/generator: republish when the plugin
#     list changes.
#   - schedule: a daily safety net so new plugin versions get picked up even if
#     no one triggers a manual run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - registry-sources.json
      - scripts/generate-registry.mjs
      - .github/workflows/publish-registry.yml
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-registry
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GCS_BUCKET: mf-plugins-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # generate-registry.mjs reads registry-sources.json and calls the GitHub
      # Releases API for each plugin repo. GITHUB_TOKEN raises the API rate
      # limit and covers public reads. With no flags it writes one registry file
      # per registry id referenced in the sources (registry.json and
      # registry-experimental.json).
      - name: Generate registry files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run registry:generate

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload registry files to GCS
        run: |
          gcloud storage cp registry.json "gs://${GCS_BUCKET}/registry.json"
          gcloud storage cp registry-experimental.json "gs://${GCS_BUCKET}/registry-experimental.json"
